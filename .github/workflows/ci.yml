name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC, so harness drift shows up without a PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rib
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin to the runtime Keelson validates against. Bump deliberately.
          bun-version: 1.3.14

      # @keelson/shared resolves from the release tarball pinned in package.json,
      # so this job is reproducible and needs no keelson checkout.
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint + format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The check job proves the rib against the @keelson/shared release it pins.
  # This one swaps in keelson `main`, so a harness contract change that breaks
  # the rib is seen before the next harness release. Informational: keep it out
  # of the required checks so harness churn never blocks an unrelated PR.
  harness-main:
    name: Harness main canary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout rib
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # Nested under node_modules, and deliberately NOT installed: with no
      # node_modules of its own, the harness source resolves zod by walking up
      # into the rib's install. A second zod copy at another minor fails
      # typecheck on zod's own version brand, which is noise, not contract drift.
      - name: Checkout keelson main (packages/shared only)
        uses: actions/checkout@v7
        with:
          repository: danielscholl/keelson
          path: node_modules/.keelson-src
          sparse-checkout: packages/shared
          persist-credentials: false

      - name: Link @keelson/shared from main
        run: |
          rm -rf node_modules/@keelson/shared
          ln -sfn "$PWD/node_modules/.keelson-src/packages/shared" node_modules/@keelson/shared

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
