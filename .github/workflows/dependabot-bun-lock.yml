name: Dependabot bun.lock sync

# Dependabot bumps package.json but cannot update bun.lock, so its PRs fail
# CI's frozen install. This job regenerates the lockfile and uploads it as an
# artifact; it never writes to the repo. The privileged
# dependabot-bun-lock-push.yml applies it through the Contents API, so the PR's
# untrusted head is never checked out in a job holding write access.

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lockfile:
    name: Regenerate bun.lock
    # Dependabot's immutable numeric user id, not the spoofable actor name.
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The merge ref, not the head: it is what CI's frozen install runs against.
      - name: Checkout PR merge ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match ci.yml so the lockfile is generated by the validated runtime.
          bun-version: 1.3.14

      - name: Regenerate lockfile from the bumped manifest
        run: bun install --lockfile-only --ignore-scripts

      - name: Check for lockfile drift
        id: diff
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync with package.json; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save PR branch metadata
        if: steps.diff.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p pr
          printf '%s\n' "$HEAD_REF" > pr/HEAD_REF

      - name: Upload lockfile artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bun-lock
          path: |
            pr/HEAD_REF
            bun.lock
          if-no-files-found: error
          retention-days: 1
