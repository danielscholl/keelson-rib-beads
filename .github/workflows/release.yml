name: Release

# Release-please watches master: conventional commits accumulate into a release
# PR (version bump + CHANGELOG); merging that PR creates the tag and the GitHub
# Release. A rib installs from source (`keelson rib add <repo>`), so there are
# no build artifacts to attach — the tag and the generated notes are the whole
# release.
on:
  push:
    branches: [master]
  # A release run that never gets a runner leaves the merged release untagged
  # until the next push; once a workflow file changes after the release commit,
  # GITHUB_TOKEN can no longer tag it. The daily run retries well inside that.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A RELEASE_PLEASE_TOKEN PAT (optional) makes CI run on the release
          # PR; with the default GITHUB_TOKEN the PR gets no workflow runs.
          # Give it Contents, Pull requests, Issues and Workflows write: only
          # Workflows lets it tag a release commit older than a workflow change.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Catch a silently-dropped release: if a release PR merges without its
  # `autorelease: pending` label (a GitHub label-API flake at PR-creation time
  # can strip it), release-please bumps the manifest on master but never tags the
  # release — a green run with no release. Assert the manifest version has a
  # matching GitHub Release so that turns into a red build instead of a gap.
  verify-release:
    name: Verify release exists for manifest version
    needs: release-please
    # Also runs when release-please fails: a release it can't tag is what this reports.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert a GitHub Release exists for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          tag="v${version}"
          # 0.0.0 is the pre-release manifest and is never tagged.
          if [ "${version}" = "0.0.0" ]; then
            echo "ok: manifest still at 0.0.0; nothing released yet"
            exit 0
          fi
          # release-please creates the Release in the job above; retry to ride
          # out GitHub's eventual consistency before failing.
          for attempt in 1 2 3; do
            if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "ok: release ${tag} exists for manifest version ${version}"
              exit 0
            fi
            echo "attempt ${attempt}: ${tag} not visible yet; retrying in 5s"
            sleep 5
          done
          echo "::error::.release-please-manifest.json is at ${version} but no ${tag} release exists — a release was silently dropped. If release-please failed with 'Resource not accessible by integration', the release commit predates a workflow-file change and GITHUB_TOKEN cannot tag it: set RELEASE_PLEASE_TOKEN, or create the release from an account with workflow access, then re-run this workflow. Otherwise the release PR merged without its 'autorelease: pending' label; re-label it and re-run." >&2
          exit 1
