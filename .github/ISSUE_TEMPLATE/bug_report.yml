name: Bug report
description: Something in the Beads rib isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public. Leave out real bead titles, descriptions, notes and
        comments; describe beads by shape instead ("an epic with three children,
        one blocked"). For a security issue, do **not** file here; see
        [SECURITY.md](https://github.com/danielscholl/keelson-rib-beads/security/policy).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Board (tracker strip, Overview, In flight, Next up, Your calls)
        - Board (wave map, Backlog, Shipped)
        - Inspector
        - Chat tools
        - beads-work workflow
        - beads-next or beads-groom workflow
        - Reconcile merged PRs
        - Install, bd version, or first run
        - Not sure / other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behavior and the panel, tool or workflow node that showed it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rib version or commit, `keelson version`, `bd version`, `gh --version`, and OS. For a workflow bug, the provider and the node that failed.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any useful `[beads]` server log lines or run output, with tracker content and tokens removed.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed real tracker content from this report.
          required: true
